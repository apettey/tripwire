; Fork-owned: session and header hardening for the Tripwire image (copied to conf.d by docker/Dockerfile).
; Session cookies: not readable from JavaScript, only sent over HTTPS (set SESSION_COOKIE_SECURE=0 when serving
; plain http), not sent on cross-site sub-requests, and unknown session IDs are rejected instead of adopted.
session.cookie_httponly = 1
session.cookie_secure = ${SESSION_COOKIE_SECURE:-1}
session.cookie_samesite = Lax
session.use_strict_mode = 1
session.use_only_cookies = 1
; No X-Powered-By header
expose_php = 0
