# Security headers for every response, included by nginx.conf in the server block and again in every
# location that has its own add_header (nginx drops inherited add_header lines in such a location).
# The Content-Security-Policy only has the directives the app can live with today: it still relies on inline scripts
# and styles and on several CDNs, so no script-src/style-src yet. It stops <base> hijacking, plugins and framing.
# HSTS only on HTTPS requests ($hsts is empty otherwise, and nginx then sends no header; map in nginx.conf).
add_header X-Frame-Options DENY always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'none'" always;
add_header Strict-Transport-Security $hsts always;
