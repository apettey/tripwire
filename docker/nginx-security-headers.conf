# Security headers for every response, included by nginx.conf in the server block and again in every
# location that has its own add_header (nginx drops inherited add_header lines in such a location).
# No Content-Security-Policy yet: the app still relies on inline scripts and styles.
add_header X-Frame-Options DENY always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
