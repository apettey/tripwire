; Local dev only: log every error to `docker compose logs app` and pick up file edits immediately.
; Errors are not displayed: upstream triggers PHP 8 deprecation notices that would corrupt JSON responses.
display_errors = "0"
log_errors = "1"
error_reporting = E_ALL
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
; The dev stack serves plain http://127.0.0.1:8080 (docker/php-security.ini makes the session cookie Secure)
session.cookie_secure = 0
