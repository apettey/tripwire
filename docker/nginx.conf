# Based on .docker/nginx/tripwire.conf, with php-fpm running in the same container
server {
    listen       80 default_server;
    server_name  _;

    root   /opt/app/public;
    index index.php index.html index.htm;

    client_max_body_size 16m;

    server_tokens off;
    include /etc/nginx/snippets/security-headers.conf;

    error_page 403 /403.html;
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    location ~ ^/(403|404|50x)\.html$ {
        root /usr/share/nginx/tripwire-errors;
        internal;
    }

    # tripwire.php references its css/js as ...?v=<fork release version>, a new URL every release: cache
    # those for good. Everything else (?v=dev in the dev stack, unversioned files, whats-new/features.json,
    # version.json) must be revalidated (cheap 304 via ETag). See $asset_cache_control below.
    location ~* \.(js|css|json)$ {
        add_header Cache-Control $asset_cache_control always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location /api {
        rewrite ^/api(.*) /api.php?q=$1;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SERVER_NAME $host;
        fastcgi_param HTTPS $fwd_https if_not_empty;
        # nginx sets these (security-headers.conf); drop PHP's copies so each is sent once
        fastcgi_hide_header X-Frame-Options;
        fastcgi_hide_header X-Content-Type-Options;
        fastcgi_hide_header Referrer-Policy;
        fastcgi_hide_header Content-Security-Policy;
        fastcgi_hide_header Strict-Transport-Security;
    }
}

# Immutable only for js/css requested with ?v=X.Y.Z (a release); a CDN that rewrites no-cache to a
# max-age (Cloudflare's Browser Cache TTL) then can't keep old bundles alive across upgrades (#14)
map "$uri|$arg_v" $asset_cache_control {
    default                                     "no-cache";
    "~*\.(js|css)\|[0-9]+\.[0-9]+\.[0-9]+$"     "public, max-age=31536000, immutable";
}

# Behind a TLS-terminating proxy (Traefik, Caddy, ...) tell PHP the request was HTTPS
map $http_x_forwarded_proto $fwd_https {
    default "";
    https   on;
}

# HSTS (security-headers.conf) only when the request reached the proxy over HTTPS; one year, this host only
map $fwd_https $hsts {
    default "";
    on      "max-age=31536000";
}
