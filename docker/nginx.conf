# Based on .docker/nginx/tripwire.conf, with php-fpm running in the same container
server {
    listen       80 default_server;
    server_name  _;

    root   /opt/app/public;
    index index.php index.html index.htm;

    client_max_body_size 16m;

    error_page 403 /403.html;
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    location ~ ^/(403|404|50x)\.html$ {
        root /usr/share/nginx/tripwire-errors;
        internal;
    }

    # Bundles are referenced as app.min.js?v=<upstream version>, which doesn't change when this
    # fork ships new code; make browsers revalidate (cheap 304 via ETag) instead of guessing freshness.
    location ~* \.(js|css|json)$ {
        add_header Cache-Control "no-cache";
    }

    location /api {
        rewrite ^/api(.*) /api.php?q=$1;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SERVER_NAME $host;
        fastcgi_param HTTPS $fwd_https if_not_empty;
    }
}

# Behind a TLS-terminating proxy (Traefik, Caddy, ...) tell PHP the request was HTTPS
map $http_x_forwarded_proto $fwd_https {
    default "";
    https   on;
}
