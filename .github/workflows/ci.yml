# Checks for every PR (and main). The Docker image is only built on main (docker-publish.yml).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  js:
    name: JS tests and bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm

      - run: npm ci --no-audit --no-fund

      # mocha directly: upstream's 'gulp test' task doesn't wait for mocha, so failures could pass
      - name: Unit tests
        run: npx mocha --recursive app/js-test

      - name: Bundles build
        env:
          DISABLE_NOTIFIER: "true"
        run: |
          npx gulp --gulpfile docker/gulpfile.dev.js --cwd . js css
          test -s public/js/app.min.js && test -s public/css/app.min.css

      - name: What's New data is valid
        run: |
          node -e '
            const f = require("./public/whats-new/features.json").features;
            const prs = f.map(x => x.pr);
            if (!Array.isArray(f) || f.some(x => !Number.isInteger(x.pr) || !x.title || !x.description)) throw new Error("every entry needs pr (integer), title and description");
            if (new Set(prs).size !== prs.length) throw new Error("duplicate pr numbers: " + prs);
            console.log("features.json ok:", prs.join(", "));'

  php:
    name: PHP syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Same PHP as the image (version read from docker/Dockerfile, which Dependabot bumps), so compile-time
      # deprecations of that version fail the job too; the dev stack's PHP image must match it
      - name: php -l
        run: |
          php=$(grep -oE 'php:[0-9]+\.[0-9]+\.[0-9]+' docker/Dockerfile | sort -u)
          if [ "$(printf '%s' "$php" | grep -c .)" -ne 1 ]; then
            echo "docker/Dockerfile must pin exactly one php:X.Y.Z image, found: ${php:-none}" >&2; exit 1
          fi
          if grep -oE 'php:[0-9.]+' docker-compose.dev.yml | grep -vxq "$php"; then
            echo "docker-compose.dev.yml uses a different PHP than docker/Dockerfile ($php)" >&2; exit 1
          fi
          docker run --rm -v "$PWD:/src" -w /src "$php-cli-alpine" sh -c '
            failed=0
            for f in $(find . -name "*.php" -not -path "./vendor/*" -not -path "./node_modules/*"); do
              out=$(php -d error_reporting=E_ALL -d display_errors=stderr -l "$f" 2>&1) || { echo "$out"; failed=1; continue; }
              case "$out" in *Deprecated*|*Warning*) echo "$out"; failed=1 ;; esac
            done
            exit $failed'

  scripts:
    name: Workflows and scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

      - name: shellcheck
        run: shellcheck --severity=warning .github/scripts/*.sh docker/*.sh

      - name: Version calculation tests
        run: bash .github/scripts/test-next-version.sh
