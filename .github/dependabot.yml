# Weekly dependency updates. Workflow actions are pinned to commit SHAs (with a `# vX.Y.Z` comment);
# Dependabot bumps the SHA and the comment together. Minor/patch updates come as one grouped PR per
# ecosystem so they don't flood the stack of open feature PRs.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]

  # docker/Dockerfile (base images: node, php-fpm-alpine)
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
        update-types: [minor, patch]
    # PHP: patch (security) releases only. A new PHP minor (8.6 ...) is a manual upgrade: its first tags are
    # release candidates (8.6.0RC7 broke main), and docker-php-extension-installer and the dev compose
    # images must move with it
    ignore:
      - dependency-name: php
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
