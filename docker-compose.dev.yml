# Local development stack: http://localhost:8080
#
#   cp .env.example .env        # optional; fill in EVE_SSO_CLIENT / EVE_SSO_SECRET to log in
#   docker compose -f docker-compose.dev.yml up --build
#
# The repo is bind-mounted into the container, so PHP edits are live.
# The `assets` service watches app/js and app/css and rebuilds public/js/app.min.js
# and public/css/app.min.css on change.

name: tripwire-dev

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "127.0.0.1:${DEV_HTTP_PORT:-8080}:80"
    environment:
      DB_HOST: mysql
      DB_NAME: tripwire_database
      DB_USER: ${MYSQL_USER:-tripwire}
      DB_PASSWORD: ${MYSQL_PASSWORD:-tripwire}
      TRIPWIRE_DOMAIN: localhost:${DEV_HTTP_PORT:-8080}
      TRIPWIRE_HTTPS: "false"
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      EVE_SSO_CLIENT: ${EVE_SSO_CLIENT:-}
      EVE_SSO_SECRET: ${EVE_SSO_SECRET:-}
      APP_NAME: ${APP_NAME:-}
      TRIPWIRE_API: ${TRIPWIRE_API:-}
      ENABLE_SEARCH_SCOPE: ${ENABLE_SEARCH_SCOPE:-}
      DISCORD_WEB_HOOK: ${DISCORD_WEB_HOOK:-}
      USER_AGENT: ${USER_AGENT:-}
      ZKILL_FEED_ENABLED: ${ZKILL_FEED_ENABLED:-}
      KILL_REPORT_FRIENDLY_CORPORATIONS: ${KILL_REPORT_FRIENDLY_CORPORATIONS:-}
      ZKILL_RETENTION_HOURS: ${ZKILL_RETENTION_HOURS:-}
      ZKILL_API_INTERVAL: ${ZKILL_API_INTERVAL:-}
      # Discord notifications: dev key for encrypting webhook URLs, and the fake Discord below (dev only;
      # only local hosts are accepted, see docker/README.md#discord-notifications)
      DISCORD_SECRET_KEY: ${DISCORD_SECRET_KEY:-dev-only-discord-secret-key}
      DISCORD_API_BASE: ${DISCORD_API_BASE:-http://discord-mock:8080/api}
      TZ: ${TZ:-}
      # Upstream's settings.php, mounted outside /opt/app (a mount point inside it would leave an empty
      # file in the repo); docker/settings.php reads upstream's version from it
      TRIPWIRE_UPSTREAM_SETTINGS: /opt/tripwire-upstream/settings.php
    volumes:
      - ./:/opt/app
      # Docker creates empty (gitignored) config.php / db.inc.php in the repo as mount points
      - ./docker/config.php:/opt/app/config.php:ro
      - ./docker/db.inc.php:/opt/app/db.inc.php:ro
      # Same as the image: no upstream Google Analytics / PayPal panel (opt in with GA_MEASUREMENT_ID etc.)
      - ./docker/analytics.inc.php:/opt/app/analytics.inc.php:ro
      - ./docker/donation_panel.inc:/opt/app/donation_panel.inc:ro
      # Same as the image: VERSION is the fork version ("dev" here), upstream's version is UPSTREAM_VERSION
      - ./docker/settings.php:/opt/app/settings.php:ro
      - ./settings.php:/opt/tripwire-upstream/settings.php:ro
      - ./docker/php-dev.ini:/usr/local/etc/php/conf.d/zz-dev.ini:ro
      - php-sessions:/var/lib/php/session   # stay logged in across rebuilds
    depends_on:
      mysql:
        condition: service_healthy

  assets:
    image: node:20-bookworm-slim
    working_dir: /src
    environment:
      DISABLE_NOTIFIER: "true"
    command: sh -c "npm ci --no-audit --no-fund && npx gulp --gulpfile docker/gulpfile.dev.js --cwd /src watch"
    volumes:
      - ./:/src
      - node_modules:/src/node_modules

  mysql:
    image: mysql:8.0.40
    command:
      - --event-scheduler=ON
      - --sql-mode=NO_ENGINE_SUBSTITUTION
      - --log-bin-trust-function-creators=1
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: tripwire_database
      MYSQL_USER: ${MYSQL_USER:-tripwire}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-tripwire}
    ports:
      - "127.0.0.1:${DEV_MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Fake Discord webhook API (docker/dev/discord-mock.php): GET http://127.0.0.1:9095/messages shows what was sent
  discord-mock:
    image: php:8.3-cli-alpine
    command: php -S 0.0.0.0:8080 /mock/discord-mock.php
    ports:
      - "127.0.0.1:${DEV_DISCORD_MOCK_PORT:-9095}:8080"
    volumes:
      - ./docker/dev:/mock:ro

  adminer:
    image: adminer
    ports:
      - "127.0.0.1:${DEV_ADMINER_PORT:-9000}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql

volumes:
  php-sessions:
  mysql-data:
  node_modules:
